# Use a persistent PostgreSQL database for Streamlit Community Cloud.
[database]
url = "postgresql://USERNAME:PASSWORD@HOST:5432/DATABASE?sslmode=require"

# Used only when the database has no users. Change this password after first sign-in.
[auth]
admin_name = "Report Administrator"
admin_email = "admin@example.edu"
admin_password = "replace-with-a-random-temporary-password"
